;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3-qio_opi_per]
; Back to the original URL form - "55.03.36" isn't valid semver (leading
; zero), so it can't be pinned as name@version. PO1_Hardware_BLE_Test is
; now pinned to espressif32@7.1.3 instead, which is what actually stopped
; the two platforms fighting over PlatformIO's shared unversioned install
; slot - this line didn't need to change.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
board     = esp32-s3-devkitc-1
lib_deps  =
	adafruit/Adafruit NeoPixel@^1.15.2
	bogde/HX711@^0.7.5
	PaulStoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
	bblanchon/ArduinoJson@^6.21.3

