; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.21.3
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
; WiFi credential macros (ENV_HOME_SSID etc.) are injected by load_wifi_env.py
; below, not by ${sysenv.*} here - that only worked when env vars were set in
; the invoking shell (flash.ps1), not when built via VS Code's own
; Upload/Monitor buttons, which silently baked in blank credentials instead.
extra_scripts = pre:load_wifi_env.py