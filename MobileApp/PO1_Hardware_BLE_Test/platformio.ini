; Standalone BLE proof-of-concept for PO1.
; Separate from PO1_Hardware/ (the working WiFi/REST firmware) so this experiment
; can't break what already works. Flash with:
;   pio run -d PO1_Hardware_BLE_Test --target upload

[env:esp32dev]
; Pinned to the plain, already-installed espressif32 build - avoids ever
; colliding again with PO1_FALL2026's pioarduino fork, which
; also self-identifies as "espressif32" and otherwise fights this project
; for the same unversioned local install slot.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.21.3
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
